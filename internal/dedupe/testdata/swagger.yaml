basePath: /
definitions:
  vm.CreateProductInput:
    properties:
      name:
        type: string
    type: object
  vm.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  vm.Listing:
    properties:
      marketplace:
        type: string
      uuid:
        type: string
    type: object
  vm.Product:
    properties:
      name:
        type: string
      uuid:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Probe API
  version: "1.0"
paths:
  /listings/:
    get:
      description: List listings
      parameters:
      - description: Which marketplace
        in: query
        name: marketplace
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vm.Listing'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: List listings
      tags:
      - /listings
  /listings/{uuid}:
    get:
      description: Read one listing
      parameters:
      - description: The listing's uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
