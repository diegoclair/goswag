            $ref: '#/definitions/vm.Listing'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Read one listing
      tags:
      - /listings
    put:
      consumes:
      - application/json
      description: Update a listing
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/vm.CreateProductInput'
      - description: The listing's uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vm.Listing'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Update a listing
      tags:
      - /listings
  /listings/{uuid}/history/{event_id}:
    get:
      description: Read one listing event
      parameters:
      - description: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: event_id
        in: path
        name: event_id
        required: true
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vm.Listing'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Read one listing event
      tags:
      - /listings
  /products/:
    get:
      description: List products
      parameters:
      - description: Page, 1-based
        in: query
        name: page
        type: number
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
