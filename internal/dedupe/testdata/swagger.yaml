      description: Delete a product
      parameters:
      - description: The product's uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Delete a product
      tags:
      - /products
    get:
      description: Read one product
      parameters:
      - description: The product's uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vm.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Read one product
      tags:
      - /products
    put:
      consumes:
      - application/json
      description: Rename a product
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/vm.CreateProductInput'
      - description: The product's uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: User access token
        in: header
        name: user-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vm.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Rename a product
      tags:
      - /products
schemes:
- http
