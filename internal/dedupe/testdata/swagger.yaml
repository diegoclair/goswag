          description: Created
          schema:
            $ref: '#/definitions/vm.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vm.ErrorResponse'
      summary: Create a product
      tags:
      - /products
